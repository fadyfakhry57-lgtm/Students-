<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3ec1f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mr. Michael">
<title>Mr. Michael Fakhry</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;800&display=swap">
<style>
:root{
  --ink:#3a1f6e;--muted:#6b5a8e;--bg:#eaf7ff;--card:#ffffff;--field:#f5f9ff;--line:#cfe2f3;
  --sky:#3ec1f5;--sun:#ffb703;--sunD:#c97800;--berry:#ff3d71;--berryD:#b3174a;
  --mint:#14b8a6;--mintD:#0b7a6f;--grape:#7b2ff7;--grapeD:#4c1aa8;--ok:#22b14c;--okD:#14803a;
  --heroTop:#3ec1f5;--heroBot:#bdeeff;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#f1eaff;--muted:#b9a8e0;--bg:#150f27;--card:#231a3d;--field:#1b1432;--line:#3a2e5c;
  --heroTop:#2a1f55;--heroBot:#150f27;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#f1eaff;--muted:#b9a8e0;--bg:#150f27;--card:#231a3d;--field:#1b1432;--line:#3a2e5c;--heroTop:#2a1f55;--heroBot:#150f27;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Baloo Bhaijaan 2",Tahoma,"Segoe UI",sans-serif;font-weight:600;font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 120px}

/* ---------- hero ---------- */
.hero{position:relative;text-align:center;padding:34px 16px 26px;background:linear-gradient(var(--heroTop),var(--heroBot));border-radius:0 0 46px 46px;overflow:hidden}
.hero:before{content:"";position:absolute;top:-150px;left:50%;width:520px;height:300px;margin-left:-260px;border-radius:50%;border:14px solid rgba(255,255,255,.22);pointer-events:none}
.avatar{position:relative;display:block;margin:12px auto 0;width:136px;height:136px;padding:0;border:0;border-radius:50%;background:#fff;
  box-shadow:0 0 0 6px #fff,0 0 0 13px var(--sun),0 0 0 20px var(--berry),0 0 0 27px var(--grape),0 14px 0 27px rgba(58,31,110,.18)}
.avatar img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar:active{transform:scale(.96)}
.tname{margin:40px 0 0;font-size:40px;line-height:1.15;font-weight:800;color:#3a1f6e;-webkit-text-stroke:7px #fff;paint-order:stroke fill}
.ttitle{display:inline-block;margin:8px 0 0;padding:0 18px;border-radius:20px;background:var(--grape);color:#fff;font-size:17px;box-shadow:0 4px 0 var(--grapeD)}
.hello{margin:12px 0 0;font-size:18px;color:#3a1f6e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hello{color:var(--ink)}}

/* ---------- stages ---------- */
.stages{display:flex;gap:10px;overflow-x:auto;padding:22px 2px 10px;scrollbar-width:none}
.stages::-webkit-scrollbar{display:none}
.chip{flex:none;border:3px solid var(--line);background:var(--card);border-radius:22px;padding:2px 18px;font-weight:800;font-size:17px;box-shadow:0 4px 0 var(--line)}
.chip[aria-pressed="true"]{background:var(--sun);border-color:#fff;color:#3a1f6e;box-shadow:0 4px 0 var(--sunD)}

/* ---------- lessons ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;margin-top:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-height:190px;padding:20px 10px 14px;border:4px solid var(--c);border-radius:28px;background:var(--card);box-shadow:0 8px 0 var(--d)}
.tile:active{transform:translateY(5px);box-shadow:0 3px 0 var(--d)}
.emo{display:grid;place-items:center;width:78px;height:78px;border-radius:50%;background:var(--c);font-size:42px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15);margin-bottom:6px}
.tt{font-size:18px;font-weight:800;line-height:1.3}
.tm{font-size:14px;color:var(--muted)}
.tag{position:absolute;top:-14px;inset-inline-start:-6px;border:3px solid #fff;border-radius:16px;padding:0 10px;font-size:15px;font-weight:800;color:#fff;background:var(--berry);box-shadow:0 3px 0 var(--berryD)}
.tag.open{background:var(--ok);box-shadow:0 3px 0 var(--okD)}
.tag.free{background:var(--mint);box-shadow:0 3px 0 var(--mintD)}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;border:3px dashed var(--line);border-radius:28px;color:var(--muted)}
.empty b{display:block;font-size:44px}

.codeBtn{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));border:4px solid #fff;border-radius:30px;padding:4px 26px;background:var(--grape);color:#fff;font-size:19px;font-weight:800;box-shadow:0 6px 0 var(--grapeD),0 10px 24px rgba(58,31,110,.3);white-space:nowrap}
.codeBtn:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 var(--grapeD)}

/* ---------- buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:3px solid transparent;border-radius:18px;padding:4px 16px;font-weight:800;background:var(--field);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--grape);color:#fff;box-shadow:0 4px 0 var(--grapeD)}
.btn.wa{background:#25d366;color:#08361b;box-shadow:0 4px 0 #128c4a}
.btn.danger{background:transparent;color:var(--berry);border-color:var(--berry);box-shadow:none}
.btn.sm{padding:0 12px;font-size:15px;border-radius:14px}
.btn.block{display:flex;width:100%;font-size:19px;padding:8px 16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:block;margin:12px 0 0;font-size:15px;color:var(--muted)}
.in{display:block;width:100%;margin-top:4px;border:3px solid var(--line);border-radius:16px;background:var(--field);padding:6px 12px;font-size:17px}
.in:focus{border-color:var(--grape);outline:none}
.err{color:var(--berry);font-size:15px;min-height:1.5em;margin:6px 0 0}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}
.check{display:flex;align-items:center;gap:8px;margin-top:12px}
.check input{width:22px;height:22px;accent-color:var(--grape)}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(21,15,39,.55)}
.sheetBox{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:30px 30px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:700px){.sheet{align-items:center}.sheetBox{border-radius:30px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheetBox{animation:none}}
.sheetHead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sheetHead h2{flex:1;margin:0;font-size:23px;line-height:1.3}
.x{border:0;background:var(--field);width:40px;height:40px;border-radius:50%;font-size:20px;flex:none}
.price{display:inline-block;margin:2px 0 10px;padding:0 16px;border-radius:18px;background:var(--sun);color:#3a1f6e;font-size:22px;font-weight:800;box-shadow:0 4px 0 var(--sunD)}
.steps{list-style:none;margin:6px 0 0;padding:0;counter-reset:s}
.steps>li{position:relative;counter-increment:s;padding:0 48px 18px 0;border-inline-start:0}
.steps>li:before{content:counter(s);position:absolute;right:0;top:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--berry);color:#fff;font-weight:800;box-shadow:0 3px 0 var(--berryD)}
.steps>li:not(:last-child):after{content:"";position:absolute;right:16px;top:42px;bottom:4px;border-right:3px dotted var(--line)}
.steps h3{margin:2px 0 6px;font-size:19px}
.pay{display:flex;align-items:center;gap:10px;margin:8px 0;padding:10px 12px;border-radius:18px;border:3px solid var(--line);background:var(--field)}
.pay .pl{flex:1;min-width:0}
.pay .pn{display:block;font-size:14px;color:var(--muted)}
.pay .pv{display:block;font-size:20px;font-weight:800;direction:ltr;text-align:right;overflow-wrap:anywhere}
.pay.ip{border-color:#7b2ff7}.pay.vc{border-color:#e60000}
.radios{display:flex;gap:8px;margin-top:4px}
.radios label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:3px solid var(--line);border-radius:16px;padding:6px;background:var(--field)}
.radios input{accent-color:var(--grape)}
.radios label:has(input:checked){border-color:var(--grape)}
.codeIn{direction:ltr;text-align:center;font-size:24px;letter-spacing:3px;font-weight:800;text-transform:uppercase}

/* ---------- viewer ---------- */
.viewer{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg)}
.vbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:var(--grape);color:#fff}
.vbar .btn{background:#fff;color:var(--grape);box-shadow:0 3px 0 var(--grapeD)}
.vbar span{flex:1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer iframe{flex:1;width:100%;border:0;background:#fff}

/* ---------- admin ---------- */
.admin{position:fixed;inset:0;z-index:30;overflow-y:auto;background:var(--bg)}
.abar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--ink);color:var(--bg)}
.abar h2{flex:1;margin:0;font-size:20px}
.abar .btn{box-shadow:none}
.badge{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;background:var(--berry);color:#fff;font-size:14px;padding:0 6px}
.atabs{display:flex;gap:8px;overflow-x:auto;padding:14px 14px 4px;max-width:720px;margin:0 auto;scrollbar-width:none}
.atabs button{flex:none;border:3px solid var(--line);background:var(--card);border-radius:18px;padding:2px 16px;font-weight:800}
.atabs button[aria-selected="true"]{background:var(--sun);border-color:#fff;color:#3a1f6e;box-shadow:0 4px 0 var(--sunD)}
.apanel{max-width:720px;margin:0 auto;padding:10px 14px 60px}
.box{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:14px 16px;margin:14px 0}
.box h3{margin:0 0 4px;font-size:19px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .ie{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--c,var(--sun));font-size:26px}
.item .ib{flex:1;min-width:0}
.item .ib b{display:block;line-height:1.3;overflow-wrap:anywhere}
.item .ib small{color:var(--muted);font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
@media (max-width:560px){.item{flex-wrap:wrap}.item .acts{flex-basis:100%;justify-content:flex-start}}
.code{direction:ltr;display:inline-block;white-space:nowrap;font-weight:800;letter-spacing:2px;font-size:19px;font-variant-numeric:tabular-nums}
.revoked{opacity:.45;text-decoration:line-through}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.swatches button{width:38px;height:38px;border-radius:50%;border:4px solid #fff;background:var(--c);box-shadow:0 0 0 2px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.photoRow{display:flex;align-items:center;gap:14px}
.photoRow img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:4px solid var(--sun)}
.newcodes{margin-top:12px;padding:12px;border-radius:18px;background:var(--field);border:3px dashed var(--ok)}
.prog{font-size:15px;color:var(--muted)}

/* ---------- toast ---------- */
.toast{position:fixed;z-index:60;left:14px;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:520px;background:#3a1f6e;color:#fff;border-radius:18px;padding:10px 16px;text-align:center;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (max-width:360px){.grid{gap:16px 10px}.tname{font-size:32px}.emo{width:64px;height:64px;font-size:34px}}
</style>
</head>
<body>

<header class="hero">
  <button class="avatar" id="avatarBtn" type="button" aria-label="صورة المدرس"><img id="tPhoto" alt=""></button>
  <h1 class="tname" id="tName" dir="auto"></h1>
  <span class="ttitle" id="tTitle" hidden></span>
  <p class="hello" id="hello" hidden></p>
</header>

<div class="wrap">
  <nav class="stages" id="stages" aria-label="المراحل"></nav>
  <main class="grid" id="lessons"></main>
</div>

<button class="codeBtn" id="codeBtn" type="button">🔑 عندي كود تفعيل</button>

<div class="sheet" id="sheet" hidden><div class="sheetBox" id="sheetBox" role="dialog" aria-modal="true"></div></div>

<div class="viewer" id="viewer" hidden>
  <div class="vbar"><button class="btn sm" id="vBack" type="button">→ رجوع</button><span id="vTitle"></span></div>
  <iframe id="vFrame" title="الدرس" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
</div>

<div class="admin" id="admin" hidden>
  <div class="abar">
    <h2>لوحة المدرس</h2>
    <button class="btn sm primary" id="pubBtn" type="button">نشر <span class="badge" id="pubCount">0</span></button>
    <button class="btn sm" id="adminExit" type="button">خروج</button>
  </div>
  <div class="atabs" role="tablist" id="atabs">
    <button role="tab" data-t="lessons">📚 الدروس</button>
    <button role="tab" data-t="codes">🔑 الأكواد والطلاب</button>
    <button role="tab" data-t="stages">🎓 المراحل</button>
    <button role="tab" data-t="settings">⚙️ الإعدادات</button>
  </div>
  <div class="apanel" id="apanel"></div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const TE=new TextEncoder(),TD=new TextDecoder();
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const b64=u8=>{let s="";for(let i=0;i<u8.length;i+=32768)s+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const digits=s=>String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
function waNum(p){p=digits(p).replace(/\D/g,"");if(p.startsWith("00"))p=p.slice(2);if(p.startsWith("0"))p="2"+p;return p}
let toastT;
function toast(t,ms){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,ms||3800)}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}toast("اتنسخ ✔")}

/* ================= crypto (AES-GCM + PBKDF2) ================= */
async function seal(raw,bytes){const iv=rnd(12);const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt"]);const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,bytes));const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return b64(o)}
async function unseal(raw,str){const d=unb64(str);const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:d.subarray(0,12)},k,d.subarray(12)))}
async function pbkdf2(pass,salt,iter,bits){const base=await crypto.subtle.importKey("raw",TE.encode(pass),"PBKDF2",false,["deriveBits"]);return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:iter},base,bits))}
const CODE_ABC="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const normCode=s=>digits(s).toUpperCase().replace(/[^A-Z0-9]/g,"");
const fmtCode=c=>c.slice(0,5)+"-"+c.slice(5);
function makeCode(){let c="";while(c.length<10){for(const b of rnd(16)){if(b<248&&c.length<10)c+=CODE_ABC[b%31]}}return c}
async function deriveCode(code){const bits=await pbkdf2(normCode(code),TE.encode("mf-code-v1"),150000,384);return{key:bits.slice(0,32),id:b64(bits.slice(32,44))}}

/* ================= device lock =================
   كل جهاز بيعمل مفتاح خاص "مش قابل للنسخ" (non-extractable) محفوظ في المتصفح.
   كود التفعيل بيتعمل لمفتاح الجهاز ده بالذات، فلو اتبعت لجهاز تاني مش هيفتح.
   رقم الجهاز كمان متسجل في ملف تعريف ارتباط (cookie) عشان نعرف لو بيانات المتصفح اتمسحت. */
let DEV=null,DEV_RESET=false;
const b64u=u8=>b64(u8).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u=s=>unb64(s.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((s.length+3)%4));
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open("mf-device",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idb(mode,fn){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction("kv",mode),rq=fn(tx.objectStore("kv"));tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error)})}
function getCookie(n){const m=document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)"));return m?decodeURIComponent(m[1]):""}
function setCookie(n,v){document.cookie=`${n}=${encodeURIComponent(v)}; max-age=${60*60*24*400}; path=/; SameSite=Lax${location.protocol==="https:"?"; Secure":""}`}
async function shortId(pub){const h=new Uint8Array(await crypto.subtle.digest("SHA-256",TE.encode(pub)));let s="";for(let i=0;i<8;i++)s+=CODE_ABC[h[i]%31];return s.slice(0,4)+"-"+s.slice(4)}
async function getDevice(){
  if(DEV)return DEV;
  let d=null;try{d=await idb("readonly",st=>st.get("dev"))}catch(e){}
  if(!d||!d.priv||!d.aes){
    const ec=await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},false,["deriveBits"]);
    const aes=await crypto.subtle.generateKey({name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
    const pub=b64u(new Uint8Array(await crypto.subtle.exportKey("raw",ec.publicKey)));
    d={priv:ec.privateKey,aes,pub,id:await shortId(pub),at:Date.now()};
    let saved=false;try{await idb("readwrite",st=>st.put(d,"dev"));saved=!!(await idb("readonly",st=>st.get("dev")))}catch(e){}
    d.volatile=!saved;
    const old=getCookie("mf_device")||LS.get("mf_device","");
    if(old&&old!==d.id){DEV_RESET=Object.keys(LS.get("mf_keys2",{})).length>0;LS.set("mf_keys2",{})}
  }
  setCookie("mf_device",d.id);LS.set("mf_device",d.id);
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  return DEV=d;
}
async function devSeal(bytes){const dv=await getDevice();const iv=rnd(12);const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},dv.aes,bytes));const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return b64(o)}
async function devUnseal(str){const dv=await getDevice();const d=unb64(str);return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:d.subarray(0,12)},dv.aes,d.subarray(12)))}
async function bindKey(shared,ck){const m=new Uint8Array(shared.length+ck.length);m.set(shared);m.set(ck,shared.length);return new Uint8Array(await crypto.subtle.digest("SHA-256",m))}
const ecImport=raw=>crypto.subtle.importKey("raw",unb64u(raw),{name:"ECDH",namedCurve:"P-256"},true,[]);
/* المدرس: يعمل كود مربوط بجهاز الطالب */
async function makeDeviceCode(pub,map){
  const devPub=await ecImport(pub);
  const eph=await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveBits"]);
  const shared=new Uint8Array(await crypto.subtle.deriveBits({name:"ECDH",public:devPub},eph.privateKey,256));
  const code=makeCode(),{key,id}=await deriveCode(code);
  const e=b64u(new Uint8Array(await crypto.subtle.exportKey("raw",eph.publicKey)));
  return {code,id,entry:{e,d:await seal(await bindKey(shared,key),TE.encode(JSON.stringify(map)))}};
}
/* الطالب: يفك الكود بمفتاح جهازه */
async function openDeviceCode(entry,ck){
  const dv=await getDevice();
  const shared=new Uint8Array(await crypto.subtle.deriveBits({name:"ECDH",public:await ecImport(entry.e)},dv.priv,256));
  return JSON.parse(TD.decode(await unseal(await bindKey(shared,ck),entry.d)));
}

async function downloadMine(){

async function redeem(raw,errEl,btn){
  const c=normCode(raw);
  if(c.length!==10){errEl.textContent="الكود 10 حروف وأرقام، زي ABCDE-23456.";return}
  btn.disabled=true;errEl.textContent="";const old=btn.textContent;btn.textContent="جاري التأكد…";
  try{
    const {key,id}=await deriveCode(c);
    const entry=DATA.codes[id];
    if(!entry||!entry.e){errEl.textContent="الكود ده مش شغال. لو المدرس لسه باعته، استنى دقيقتين وجرب تاني.";return}
    let map;
    try{map=await openDeviceCode(entry,key)}catch(x){errEl.textContent="الكود ده متعمل لجهاز تاني. كل كود بيشتغل على الجهاز اللي اتبعت منه الطلب بس.";return}
    const keys=myKeys();for(const lid in map)keys[lid]=await devSeal(unb64(map[lid]));LS.set("mf_keys2",keys);
    const names=DATA.lessons.filter(l=>map[l.id]).map(l=>l.title);
    closeSheet();renderLessons();toast("اتفتح: "+(names.join("، ")||"الدرس")+" 🎉",5000);
    if(names.length===1)openLesson(DATA.lessons.find(l=>map[l.id]));
  }catch(e){errEl.textContent="حصلت مشكلة في التفعيل. جرب تاني."}
  finally{btn.disabled=false;btn.textContent=old}
}

function squareImage(file,size){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=size;const s=Math.min(img.width,img.height);

/* ---------- publish ---------- */
function ghCfg(){
  const g=LS.get("mf_gh",{});
  if(!g.owner&&/\.github\.io$/.test(location.hostname)){g.owner=location.hostname.split(".")[0];const p=location.pathname.split("/").filter(Boolean)[0];g.repo=p&&!p.includes(".")?p:location.hostname}
  return g;
}
const ghHead=g=>({Authorization:"Bearer "+g.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
function ghErr(s){return s===401?"التوكن غلط أو انتهت صلاحيته.":s===403?"التوكن مالوش صلاحية، أو GitHub موقف الطلبات مؤقتاً.":s===404?"الحساب أو المستودع أو الفرع مش موجود، أو التوكن مش متاح له المستودع ده.":s===409||s===422?"في تعارض في الملفات. جرب تنشر تاني.":"GitHub رجّع خطأ ("+s+")."}
async function ghSha(g,path){const r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${path}?ref=${encodeURIComponent(g.branch||"main")}&t=${Date.now()}`,{headers:ghHead(g),cache:"no-store"});
  if(r.status===404)return null;if(!r.ok)throw new Error(ghErr(r.status));return (await r.json()).sha}
async function ghPut(g,path,b64content){const sha=await ghSha(g,path);
  const r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${path}`,{method:"PUT",headers:ghHead(g),body:JSON.stringify(Object.assign({message:"تحديث: "+path,content:b64content,branch:g.branch||"main"},sha?{sha}:{}))});
  if(!r.ok)throw new Error(ghErr(r.status))}
async function ghDel(g,path){const sha=await ghSha(g,path);if(!sha)return;
  const r=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${path}`,{method:"DELETE",headers:ghHead(g),body:JSON.stringify({message:"حذف: "+path,sha,branch:g.branch||"main"})});
  if(!r.ok&&r.status!==404)throw new Error(ghErr(r.status))}
const dataJson=()=>{DATA.updated=Date.now();return JSON.stringify(DATA)};
async function publish(){
  const g=LS.get("mf_gh",{});
  if(!g.token||!g.owner||!g.repo){
    sheet("النشر",`<p>عشان النشر يبقى بضغطة واحدة، اربط GitHub من <b>الإعدادات</b>.</p><p class="hint">أو حمّل الملفات وارفعها بنفسك على المستودع: <span dir="ltr">data.json</span> في الفولدر الرئيسي، وملفات <span dir="ltr">.enc</span> جوه فولدر <span dir="ltr">lessons</span>.</p>
      <div class="acts" style="justify-content:flex-start;margin-top:12px"><button class="btn primary" type="button" id="goSet">افتح الإعدادات</button><button class="btn" type="button" id="goDl">تحميل الملفات</button></div>`);
    $("#goSet").onclick=()=>{closeSheet();TAB="settings";renderAdmin()};$("#goDl").onclick=()=>{closeSheet();downloadAll()};return;
  }
  const btn=$("#pubBtn");btn.disabled=true;const files=Object.keys(PENDING),dels=[...DELETED],total=files.length+dels.length+1;let i=0;
  try{
    for(const p of files){toast(`جاري الرفع ${++i} من ${total}…`,60000);await ghPut(g,p,btoa(PENDING[p]));delete PENDING[p]}
    for(const p of dels){toast(`جاري الحذف ${++i} من ${total}…`,60000);await ghDel(g,p);DELETED.delete(p)}
    toast(`جاري الرفع ${++i} من ${total}…`,60000);await ghPut(g,"data.json",b64(TE.encode(dataJson())));DIRTY=false;
    toast("اتنشر ✔ التحديث هيظهر للطلاب خلال دقيقة أو اتنين.",6000);
  }catch(e){toast("النشر وقف: "+(e.message||"مشكلة في النت")+" الملفات اللي اترفعت اتحفظت، اضغط نشر تاني.",8000)}
  updatePub();if(!$("#admin").hidden)renderAdmin();
}
function dl(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/octet-stream"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
function downloadAll(){
  const files=Object.keys(PENDING);
  files.forEach((p,i)=>setTimeout(()=>dl(p.split("/").pop(),PENDING[p]),i*500));
  setTimeout(()=>dl("data.json",dataJson()),files.length*500);
  sheet("الملفات اتحملت",`<p>ارفعهم على المستودع في GitHub:</p><p><span dir="ltr">data.json</span> ← الفولدر الرئيسي (جنب index.html)</p>${files.length?`<p>${files.map(p=>`<span dir="ltr">${esc(p.split("/").pop())}</span>`).join("، ")} ← جوه فولدر <span dir="ltr">lessons</span></p>`:""}${DELETED.size?`<p>واحذف من فولدر lessons: <span dir="ltr">${[...DELETED].map(p=>esc(p.split("/").pop())).join("، ")}</span></p>`:""}<p class="hint">بعد ما ترفعهم اضغط "تم" عشان نصفّر عداد النشر.</p><button class="btn primary block" type="button" id="dlDone">تم</button>`);
  $("#dlDone").onclick=()=>{PENDING={};DELETED.clear();DIRTY=false;updatePub();closeSheet()};
}

/* ================= boot ================= */
(async function(){
  try{await getDevice()}catch(e){}
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(r.ok){const d=await r.json();DATA=Object.assign(DEF(),d);DATA.teacher=Object.assign(DEF().teacher,d.teacher||{})}}catch(e){}
  renderAll();
  if(DEV_RESET)toast("بيانات المتصفح اتمسحت فالدروس اتقفلت. اطلب كود جديد من المستر.",7000);
})();
</script>
